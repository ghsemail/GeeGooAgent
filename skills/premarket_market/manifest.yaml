name: premarket_market
version: "1.0.0"
description: 市场盘前报告 — 按 CN/HK/US 生成全局宏观盘前
phase: 1
mode: scheduled

tools:
  - check_trading_day
  - fetch_market_news
  - get_mcp_analysis
  - create_market_premarket_report
  - save_local_report
  - write_execution_log

rules:
  - rules/api-routing.md
  - rules/report-format.md

workflow:
  prelude:
    - id: check_trading_day
      tool: check_trading_day
  phase_a:
    - id: index_analysis
      tool: get_mcp_analysis
    - id: market_news
      tool: fetch_market_news
    - id: persist_market_report
      tools:
        - save_local_report
        - create_market_premarket_report

markets: [CN, HK, US]
