name: premarket_stock
version: "1.0.0"
description: 股票盘前报告 — 引用市场报告，为 attitude 订阅标的逐股生成报告
phase: 1
mode: scheduled

tools:
  - get_market_premarket_report
  - get_report_bot_codes
  - fetch_stock_news
  - get_mcp_analysis
  - get_capital_flow
  - get_capital_distribution
  - get_bot_yesterday_attitude
  - list_today_reports
  - create_stock_premarket_report
  - save_local_report
  - write_execution_log

rules:
  - rules/api-routing.md
  - rules/attitude-mapping.md
  - rules/report-format.md

workflow:
  prelude:
    - id: get_market_premarket_report
      tool: get_market_premarket_report
    - id: get_report_bot_codes
      tool: get_report_bot_codes
  phase_b:
    per_stock:
      - id: stock_news
        tool: fetch_stock_news
      - id: capital_flow
        tool: get_capital_flow
      - id: capital_distribution
        tool: get_capital_distribution
      - id: weekly_analysis
        tool: get_mcp_analysis
      - id: bot_attitude
        tool: get_bot_yesterday_attitude
      - id: synthesize_and_submit
        tools:
          - create_stock_premarket_report
          - save_local_report

markets: [CN, HK, US]
