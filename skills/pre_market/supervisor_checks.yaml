skill: pre_market
description: Post-run acceptance checks for market-level pre_market workflow (one market per run)
checks:
  - name: workflow_phase_done
    type: stocks_status
    expect_phase: done

  - name: market_indices_done
    type: market_status
    require_fields:
      - indices_done
      - market_news_done

  - name: market_report_api_created
    type: market_status
    require_fields:
      - market_report_id

  - name: market_report_local_md
    type: market_file_exists
    pattern: "reports/{date}/market-{market}-market-premarket.md"
